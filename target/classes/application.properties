# --- PADRONIZACAO DE NOMES (JSON snake_case -> Java camelCase) ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- CONFIGURACOES DO SERVIDOR ---
server.port=8080
server.servlet.context-path=/api

# --- CLOUDINARY CONFIG ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:root}
cloudinary.api-key=${CLOUDINARY_API_KEY:***REMOVED***}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:***REMOVED***}


# --- CLOUDINARY CONFIG ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:root}
cloudinary.api-key=${CLOUDINARY_API_KEY:***REMOVED***}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:***REMOVED***}

# --- GOOGLE OAUTH ---
google.client-id=${GOOGLE_CLIENT_ID:}

# --- FRONTEND URL (CORS) ---
app.frontend-url=${FRONTEND_URL:http://mtg-token-counter-web.vercel.app}


# --- HIBERNATE / JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- SEGURANCA E JWT ---
api.security.token.secret=${JWT_SECRET:***REMOVED***}

# --- CONFIGURACAO DE UPLOAD ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- LOGGING ---
logging.level.org.springframework.security=INFO
