# --- PADRONIZACAO DE NOMES (JSON snake_case -> Java camelCase) ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- CONFIGURACOES DO SERVIDOR ---
server.port=8080
server.servlet.context-path=/api

# --- BANCO DE DADOS (PostgreSQL) ---
# Sem valores padrão: se a variável de ambiente não estiver definida, a
# aplicação falha ao iniciar em vez de usar um segredo desatualizado/exposto.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- CLOUDINARY CONFIG ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# --- GOOGLE OAUTH ---
google.client-id=${GOOGLE_CLIENT_ID}

# --- FACEBOOK OAUTH ---
facebook.app-id=${FACEBOOK_APP_ID}
facebook.app-secret=${FACEBOOK_APP_SECRET}

# --- FRONTEND URL (CORS) ---
app.frontend-url=${FRONTEND_URL:https://mtg-token-counter-web.vercel.app}

# --- HIBERNATE / JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- SEGURANCA E JWT ---
api.security.token.secret=${JWT_SECRET}

# --- EMAIL (SMTP GMAIL) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- BUG REPORT ---
# Para onde os reports de bug são enviados. Se vazio, usa o próprio GMAIL_USERNAME.
app.bugreport-email=${BUG_REPORT_EMAIL:}

# --- CONFIGURACAO DE UPLOAD ---
# max-file-size: limite por arquivo. max-request-size: limite do request inteiro
# (token = 1 imagem; bug report = até 5 anexos, por isso o total é maior).
# Mantido moderado porque /bugs aceita envio sem autenticação.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# --- LOGGING ---
logging.level.org.springframework.security=INFO
