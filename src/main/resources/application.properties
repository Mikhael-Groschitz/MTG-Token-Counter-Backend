# --- PADRONIZACAO DE NOMES (JSON snake_case -> Java camelCase) ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- CONFIGURACOES DO SERVIDOR ---
server.port=8080
server.servlet.context-path=/api

# --- BANCO DE DADOS (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-fancy-feather-acr3vvlx.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:***REMOVED***}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- CLOUDINARY CONFIG ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:root}
cloudinary.api-key=${CLOUDINARY_API_KEY:***REMOVED***}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:***REMOVED***}

# --- GOOGLE OAUTH ---
google.client-id=${GOOGLE_CLIENT_ID:274840343173-dj5kt0d1u2r87o9d877hh0u1nfcbfq2n.apps.googleusercontent.com}

# --- FRONTEND URL (CORS) ---
app.frontend-url=${FRONTEND_URL:http://mtg-token-counter-web.vercel.app}

# --- HIBERNATE / JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- SEGURANCA E JWT ---
api.security.token.secret=${JWT_SECRET:***REMOVED***}

# --- CONFIGURACAO DE UPLOAD ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- LOGGING ---
logging.level.org.springframework.security=INFO
