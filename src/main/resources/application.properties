# --- PADRONIZACAO DE NOMES (JSON snake_case -> Java camelCase) ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- CONFIGURACOES DO SERVIDOR ---
server.port=8080
server.servlet.context-path=/api

# --- BANCO DE DADOS (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- CLOUDINARY CONFIG ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# --- GOOGLE OAUTH ---
google.client-id=${GOOGLE_CLIENT_ID}

# --- FRONTEND URL (CORS) ---
app.frontend-url=${FRONTEND_URL:https://www.theforgeoftokens.com}
app.cors.allow-dev-origins=${CORS_ALLOW_DEV_ORIGINS:false}

# --- HIBERNATE / JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- SEGURANCA E JWT ---
api.security.token.secret=${JWT_SECRET}

# --- EMAIL (RESEND) ---
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:TokenForge <noreply@theforgeoftokens.com>}

# --- BUG REPORT ---
app.bugreport-email=${BUG_REPORT_EMAIL}

# --- CONFIGURACAO DE UPLOAD ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# --- LOGGING ---
logging.level.org.springframework.security=INFO
